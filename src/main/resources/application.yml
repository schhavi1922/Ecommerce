spring:
  application:
    name: ecommerce
  jackson:
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?connectTimeout=5&socketTimeout=5}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      connection-timeout: 5000
      initialization-fail-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
rewards:
  n: ${REWARD_ORDER_INTERVAL:5}
  x: ${REWARD_DISCOUNT_PERCENTAGE:10}
server:
  error:
    include-message: never
    include-stacktrace: never
